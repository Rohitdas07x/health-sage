services:

  backend:

    build:

      context: ./backend

    container_name: health-sage-backend

    ports:

      - "5000:5000"

    env_file:

      - ./backend/.env

    environment:

      MONGO_URI: mongodb://mongodb:27017/healthsage

    depends_on:

      - mongodb


  frontend:

    build:

      context: ./frontend

    container_name: health-sage-frontend

    ports:

      - "5173:5173"

    depends_on:

      - backend


  mongodb:

    image: mongo:latest

    container_name: health-sage-mongodb

    ports:

      - "27017:27017"

    volumes:

      - mongodb_data:/data/db


volumes:

  mongodb_data: